[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "Clover desktop app with Juno, a local job-search assistant powered by LM Studio."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Clover" }]
dependencies = [
    "ddgs>=9.16,<10",
    "pywebview>=5.0",
    "pypdf>=5.0",
    "trafilatura>=2.0,<3",
    "playwright>=1.55,<2",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.setuptools.packages.find]
include = ["job_agent*"]

[tool.setuptools.package-data]
job_agent = ["static/*", "migrations/*.sql"]
