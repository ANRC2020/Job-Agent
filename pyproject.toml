[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "Clover desktop app with Juno, a local job-search assistant powered by LM Studio."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Clover" }]
dependencies = ["pywebview>=5.0"]

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.setuptools.packages.find]
include = ["job_agent*"]

[tool.setuptools.package-data]
job_agent = ["static/*", "migrations/*.sql"]
