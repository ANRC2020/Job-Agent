<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clover</title>
  <link rel="icon" type="image/png" href="/app-icon.png" />
  <style>
    :root {
      --bg: #14120f;
      --panel: #1d1a16;
      --line: #3a342c;
      --ink: #f3ece3;
      --muted: #b7aa9a;
      --accent: #e2a15a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 15px/1.45 "Iowan Old Style", Palatino, "Palatino Linotype", serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app { display: flex; flex-direction: column; height: 100%; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 20px; margin: 0; letter-spacing: -0.03em; font-weight: 600; }
    .hint { color: var(--muted); font-size: 13px; }
    .gear {
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 6px 8px;
    }
    .gear:hover { color: var(--ink); }
    #thread { flex: 1; overflow: auto; padding: 28px 22px; }
    .msg { margin: 0 0 18px; max-width: 42rem; }
    .msg.user { margin-left: auto; color: var(--accent); }
    .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    form {
      display: flex;
      gap: 8px;
      padding: 16px 22px 22px;
      border-top: 1px solid var(--line);
    }
    textarea, input, select {
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 12px;
      font: inherit;
    }
    textarea { flex: 1; resize: none; min-height: 54px; }
    button {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #1a140c; border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: default; }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 6, 0.55);
    }
    .overlay.open { display: block; }
    .sheet {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(380px, 100%);
      background: var(--panel);
      border-left: 1px solid var(--line);
      padding: 22px;
      overflow: auto;
    }
    .sheet h2 { font-size: 16px; margin: 0 0 16px; }
    .sheet label { display: block; color: var(--muted); font-size: 13px; margin: 14px 0 6px; }
    .sheet select, .sheet input { width: 100%; }
    .sheet button { width: 100%; margin-top: 10px; }
    #settings-log {
      white-space: pre-wrap;
      color: var(--muted);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Clover</h1>
        <div class="hint" id="hint">Juno is starting…</div>
      </div>
      <button class="gear" id="open-settings" title="Settings" aria-label="Settings">⚙</button>
    </header>
    <div id="thread"></div>
    <form id="composer">
      <textarea id="input" placeholder="Ask Juno anything…" disabled></textarea>
      <button class="primary" id="send" type="submit" disabled>Send</button>
    </form>
  </div>
  <div class="overlay" id="settings">
    <div class="sheet">
      <h2>Settings</h2>
      <label for="model-select">Model</label>
      <select id="model-select"></select>
      <label for="model-custom">Or enter a model id</label>
      <input id="model-custom" placeholder="qwen/qwen3.5-9b" />
      <button class="primary" id="apply-model">Save and reload model</button>
      <button id="relaunch">Relaunch current model</button>
      <button id="setup">Repair install</button>
      <button id="close-settings">Close</button>
      <div id="settings-log"></div>
    </div>
  </div>
  <script>
    const thread = [];
    const $hint = document.getElementById("hint");
    const $thread = document.getElementById("thread");
    const $input = document.getElementById("input");
    const $send = document.getElementById("send");
    const $log = document.getElementById("settings-log");
    const $select = document.getElementById("model-select");
    const $custom = document.getElementById("model-custom");
    let ready = false;
    let conversationId = null;

    function setReady(isReady, model) {
      ready = isReady;
      $input.disabled = !isReady;
      $send.disabled = !isReady;
      $hint.textContent = isReady ? "Juno is ready" : "Juno is starting…";
      if (model) $custom.placeholder = model;
    }

    function fillModels(data) {
      const models = data.availableModels || [];
      const current = data.model || "";
      $select.innerHTML = models.map((name) => {
        const selected = name === current ? " selected" : "";
        return `<option value="${name}"${selected}>${name}</option>`;
      }).join("");
      if (current && !models.includes(current)) {
        $select.innerHTML = `<option value="${current}" selected>${current}</option>` + $select.innerHTML;
      }
    }

    async function refresh() {
      const data = await (await fetch("/api/status")).json();
      setReady(Boolean(data.ready), data.model);
      fillModels(data);
      return data;
    }

    function add(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.innerHTML = `<div class="who">${role}</div><div></div>`;
      div.lastChild.textContent = text;
      $thread.appendChild(div);
      $thread.scrollTop = $thread.scrollHeight;
    }

    async function post(path, body) {
      $log.textContent = "Working…";
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      const data = await res.json();
      $log.textContent = (data.logs || [data.error]).join("\n");
      await refresh();
    }

    document.getElementById("open-settings").onclick = () => {
      document.getElementById("settings").classList.add("open");
      refresh();
    };
    document.getElementById("close-settings").onclick = () => {
      document.getElementById("settings").classList.remove("open");
    };
    document.getElementById("settings").addEventListener("click", (event) => {
      if (event.target.id === "settings") event.currentTarget.classList.remove("open");
    });
    document.getElementById("relaunch").onclick = () => post("/api/start", {});
    document.getElementById("setup").onclick = () => post("/api/setup", {});
    document.getElementById("apply-model").onclick = () => {
      const model = $custom.value.trim() || $select.value;
      if (!model) return;
      post("/api/model", { model });
    };

    document.getElementById("composer").onsubmit = async (event) => {
      event.preventDefault();
      if (!ready) return;
      const text = $input.value.trim();
      if (!text) return;
      $input.value = "";
      thread.push({ role: "user", content: text });
      add("you", text);
      add("Juno", "Thinking…");
      const pending = $thread.lastChild;
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: thread, conversationId }),
      });
      const data = await res.json();
      if (data.error) {
        pending.lastChild.textContent = data.error;
        return;
      }
      conversationId = data.conversationId || conversationId;
      pending.lastChild.textContent = data.content || "";
      thread.push({ role: "assistant", content: data.content || "" });
    };

    $input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        document.getElementById("composer").requestSubmit();
      }
    });

    refresh();
    const poll = setInterval(async () => {
      const data = await refresh();
      if (data.ready) clearInterval(poll);
    }, 1500);
  </script>
</body>
</html>
